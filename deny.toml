# Supply-chain policy, checked in CI by `cargo deny check` (see .github/workflows/deny.yml).
# Run it locally with `cargo install cargo-deny --locked` and `make deny`.

[graph]
all-features = true

[advisories]
version = 2
# A yanked crate has been withdrawn by its author, usually for a bug or a bad release.
yanked = "deny"
# Advisories that have been read and judged not to apply go here, each with a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
version = 2
# Licences the project accepts in its dependencies. It is itself MIT OR Apache-2.0, so anything
# here has to be usable in a binary distributed under either.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # Mozilla's root certificate data, pulled in by rustls-platform-verifier through reqwest. It is
    # a permissive licence for data, and this is the only crate that uses it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common and only cost build time, so they are reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
