name: Feature request
description: Something segmentor should do that it does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, before the solution. What would you do with it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Another tool, a workaround, or "nothing".
  - type: markdown
    attributes:
      value: |
        Larger features start as a short design document; see [CONTRIBUTING.md](https://github.com/includeamin/segmentor/blob/main/CONTRIBUTING.md). Existing plans are in [docs/technical-design](https://github.com/includeamin/segmentor/tree/main/docs/technical-design).
