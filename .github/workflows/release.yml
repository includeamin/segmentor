name: Release

# Publishes a GitHub release for an existing version tag: an automated changelog, Linux binaries
# for x86-64 and arm64 with checksums and build attestations, and a signed multi-architecture
# container image. Choose whether it is the latest release or a preview.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, for example v1.2.0. Leave empty for the newest tag."
        required: false
        default: ""
      channel:
        description: "latest marks it as the latest release; preview marks it as a pre-release."
        type: choice
        options:
          - latest
          - preview
        default: latest

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || 'newest' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the tag and write the changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - name: Check out with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag and the previous version
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tags="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          tag="${INPUT_TAG:-$(head -n 1 <<<"$tags")}"
          if [[ -z "$tag" ]]; then
            echo "::error::No version tag exists yet. Merge a feat or fix change to main first."
            exit 1
          fi
          if ! grep -Fxq "$tag" <<<"$tags"; then
            echo "::error::$tag is not an existing vX.Y.Z tag."
            exit 1
          fi
          previous="$(grep -Fx -A 1 "$tag" <<<"$tags" | sed -n 2p || true)"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"

      - name: Generate the changelog
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
        run: |
          .github/scripts/changelog.sh "$PREVIOUS" "$TAG" \
            "${{ github.server_url }}/${{ github.repository }}" >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the changelog for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # A native arm64 runner avoids cross-compiling the C code in the TLS provider. These
          # runners are free for public repositories.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The scripts and licence files are copied aside because the build checks out the tag, which
      # may predate them.
      - name: Keep a copy of the release scripts and licences
        run: |
          cp -r .github/scripts "$RUNNER_TEMP/scripts"
          mkdir -p "$RUNNER_TEMP/legal"
          cp LICENSE-MIT LICENSE-APACHE "$RUNNER_TEMP/legal/"

      - name: Check out the tag
        run: git checkout --detach "$TAG"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the release binary
        run: |
          "$RUNNER_TEMP/scripts/stamp-version.sh" "${TAG#v}"
          cargo build --release --locked --bin segmentor

      - name: Package
        run: |
          set -euo pipefail
          name="segmentor-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp target/release/segmentor README.md vod.example.toml "dist/$name/"
          cp "$RUNNER_TEMP/legal/LICENSE-MIT" "$RUNNER_TEMP/legal/LICENSE-APACHE" "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256")

      - name: Keep the archive for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Attest and publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Download the archives and the changelog
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Gather the files
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/*.tar.gz artifacts/*.sha256 dist/
          ls -l dist artifacts

      # Ties each archive to this workflow run and commit, so a download can be checked with
      # `gh attestation verify` (see docs/releasing.md).
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "preview" ]]; then
            flags=(--prerelease --latest=false)
            title="$TAG (preview)"
          else
            flags=(--prerelease=false --latest)
            title="$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file artifacts/notes.md "${flags[@]}"
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
              --title "$title" --notes-file artifacts/notes.md --verify-tag "${flags[@]}"
          fi

  container:
    name: Publish the container image
    needs: [prepare, publish]
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      channel: ${{ inputs.channel }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
