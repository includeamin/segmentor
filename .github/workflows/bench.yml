name: Benchmarks

# Manual only: shared runners are too noisy to gate every change on latency budgets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budgets:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Measure budgets
        run: ulimit -n 65536 && make bench-enforce
