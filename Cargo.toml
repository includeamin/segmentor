[package]
name = "segmentor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Amin Jamal"]
description = "On-demand HLS and DASH packaging for MP4 files: serves fragmented MP4 straight from the source, with no pre-generated segments and no transcoding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/includeamin/segmentor"
homepage = "https://github.com/includeamin/segmentor"
documentation = "https://includeamin.github.io/segmentor/"
readme = "README.md"
keywords = ["hls", "dash", "video", "mp4", "streaming"]
categories = ["multimedia::video", "web-programming::http-server"]
# Fixtures, the handbook, the demo page, and the fuzz crate are large and not needed to build.
exclude = ["/.github", "/docs", "/demo", "/fuzz", "/tests/fixtures", "/Dockerfile", "/.dockerignore", "/book.toml", "/Makefile"]

[dependencies]
axum = "0.8"
bytes = "1"
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3.45", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Already in the tree via reqwest's rustls backend; named directly for the listener's own
# optional TLS (see docs/operations.md#tls). Its default features already match reqwest's:
# aws_lc_rs as the crypto provider, so there is only ever one in the binary.
tokio-rustls = "0.26"
# `std` is needed to load a certificate and key from disk.
rustls-pki-types = { version = "1", features = ["std"] }
tokio-stream = "0.1"
toml = "1.1"
tower-http = { version = "0.7", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# Cross-checks the in-tree parser against an independent implementation in tests.
mp4 = "0.14"
tokio = { version = "1", features = ["io-util"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "budgets"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
# Code that is never used is deleted, not left behind: dead_code is on by default, and CI turns
# every warning into an error.
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
unit_bindings = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
# Leftovers from debugging and unfinished work must not reach main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Correctness and clarity picks from the restriction group.
allow_attributes_without_reason = "warn"
mem_forget = "warn"
rc_mutex = "warn"
str_to_string = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
empty_drop = "warn"
if_then_some_else_none = "warn"
needless_raw_strings = "warn"
redundant_type_annotations = "warn"
# Rust's own `Result<_, ()>` and friends aside, these catch code that compiles but is dead weight.
redundant_clone = "warn"
useless_let_if_seq = "warn"
unnecessary_self_imports = "warn"
unnecessary_wraps = "warn"
