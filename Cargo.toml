[package]
name = "segmentor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Amin Jamal"]
description = "A video-on-demand application built with Rust"
license = "MIT"
repository = "https://github.com/includeamin/segmentor"

[dependencies]
axum = "0.8"
bytes = "1"
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
mp4 = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.45", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "budgets"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
