[package]
name = "vod-module-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Amin Jamal"]
description = "A video-on-demand application built with Rust"
license = "MIT"
repository = "https://github.com/includeamin/vod-module-rs"
readme = "README.md"

[dependencies]
axum = "0.8"
bytes = "1"
mp4 = "0.14"
rayon = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
