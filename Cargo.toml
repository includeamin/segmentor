[package]
name = "segmentor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Amin Jamal"]
description = "On-demand HLS and DASH packaging for MP4 files: serves fragmented MP4 straight from the source, with no pre-generated segments and no transcoding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/includeamin/segmentor"
homepage = "https://github.com/includeamin/segmentor"
documentation = "https://includeamin.github.io/segmentor/"
readme = "README.md"
keywords = ["hls", "dash", "video", "mp4", "streaming"]
categories = ["multimedia::video", "web-programming::http-server"]
# Fixtures, the handbook, the demo page, and the fuzz crate are large and not needed to build.
exclude = ["/.github", "/docs", "/demo", "/fuzz", "/tests/fixtures", "/Dockerfile", "/.dockerignore", "/book.toml", "/Makefile"]

[dependencies]
axum = "0.8"
bytes = "1"
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.45", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "1.1"
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# Cross-checks the in-tree parser against an independent implementation in tests.
mp4 = "0.14"
tokio = { version = "1", features = ["io-util"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "budgets"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
