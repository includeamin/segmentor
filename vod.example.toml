[server]
listen = "127.0.0.1:3000"
shutdown_delay_ms = 0       # keep serving this long after SIGTERM while /ready reports 503
shutdown_grace_ms = 30000   # then wait at most this long for in-flight streams to finish

[storage]
media_root = "tests/fixtures"

[packaging]
segment_duration_ms = 1000

[logging]
level = "debug"
format = "json"
buffer_capacity = 8192

[limits]
max_assets = 1000
max_source_bytes = 1099511627776
max_metadata_bytes = 67108864   # `moov` plus every `moof` of a fragmented file
max_fragments = 20000            # `moof` boxes in one fragmented file; remote sources cost a request each
max_tracks = 8
max_samples_per_track = 2000000
max_samples_per_segment = 100000
max_segment_bytes = 67108864
max_segment_jobs = 8
segment_queue_timeout_ms = 2000
stream_chunk_bytes = 262144
max_request_header_bytes = 16384
request_timeout_ms = 30000
max_startup_parses = 4
max_concurrent_requests = 10000
response_idle_timeout_ms = 30000
max_index_bytes = 4294967296
max_connections = 10000          # raise `ulimit -n` to match
header_read_timeout_ms = 10000   # also bounds idle keep-alive connections

[cors]
enabled = true                      # set false when a proxy or CDN adds CORS headers
allowed_origins = ["*"]             # or exact origins, e.g. ["https://player.example.com"]
allowed_methods = ["GET", "HEAD"]
allowed_headers = ["range", "if-none-match", "if-range", "x-request-id"]
exposed_headers = ["content-length", "content-range", "accept-ranges", "etag", "x-request-id"]
allow_credentials = false           # cannot be combined with "*"
max_age_seconds = 86400

[assets.sample]
path = "h264-aac.mp4"

# --- Resolving assets from a mapper service instead of the [assets.*] tables above ---
# Replace the [assets.*] tables with the following; the two forms cannot be combined.
#
# [resolver]
# type = "http"
#
# [resolver.http]
# base_url = "https://mapper.internal.example.net"
# bearer_token_env = "VOD_MAPPER_TOKEN"   # name of an environment variable; never the token itself
# connect_timeout_ms = 500
# request_timeout_ms = 2000
# max_retries = 2
# max_response_bytes = 16384
# default_ttl_ms = 300000
# min_ttl_ms = 5000
# max_ttl_ms = 3600000
# negative_ttl_ms = 5000                  # how long "no such asset" is remembered
# error_ttl_ms = 2000                     # how long a failed lookup or load is remembered
# stale_if_error_ms = 60000               # serve an expired answer this long if the mapper is down
# refresh_margin_ms = 30000               # refresh signed locations this long before expires_at
# readiness_probe_interval_ms = 0         # >0: /ready reports 503 while the mapper is unreachable
#
# [registry]
# max_cached_resolutions = 10000
# load_queue_timeout_ms = 5000
# preload = true                          # static catalog only: load everything before serving
#
# [remote_media]                          # policy for `http` locations returned by a mapper
# allowed_hosts = ["origin.example.net"]  # empty refuses all remote locations
# allow_insecure_http = false
# allow_private_addresses = false
# connect_timeout_ms = 1000
# request_timeout_ms = 10000
# max_retries = 2
# max_inflight_reads = 64
