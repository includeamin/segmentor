# nginx-vod-module configured to do the same work as segmentor in bench/compare/segmentor.toml:
# local files, 6-second keyframe-aligned segments, fMP4 HLS with relative URLs, and a metadata
# cache but no response cache (segmentor caches parsed metadata, never segments). run.sh also
# measures it with the response cache on, as nginx-cached, by mounting response-cache-on.conf.
worker_processes 4;                 # matches TOKIO_WORKER_THREADS=4 for segmentor
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_requests 1000000;
    keepalive_timeout 60s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # The module's own performance recommendations.
    aio on;
    open_file_cache max=1000 inactive=5m;
    open_file_cache_valid 2m;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    # gzip manifests, as the module's README recommends.
    gzip on;
    gzip_types application/vnd.apple.mpegurl application/dash+xml;

    vod_mode local;
    vod_metadata_cache metadata_cache 512m;
    # Off here on purpose: segmentor has no segment cache, and a CDN is expected in front of
    # both. The nginx-cached service mounts response-cache-on.conf over this include to
    # measure nginx-vod-module's best case.
    include response-cache.conf;
    vod_segment_duration 6000;
    vod_align_segments_to_key_frames on;
    vod_manifest_segment_durations_mode accurate;
    vod_hls_container_format fmp4;
    vod_hls_absolute_master_urls off;
    vod_hls_absolute_index_urls off;
    vod_hls_absolute_iframe_urls off;

    server {
        listen 80 reuseport;

        location = /health {
            return 200 "ok\n";
        }

        location /hls/ {
            alias /media/;
            vod hls;
        }

        location /dash/ {
            alias /media/;
            vod dash;
        }
    }
}
