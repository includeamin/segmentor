# A starting point for running vodnik on Kubernetes: a ConfigMap, a Deployment with probes and a
# hardened security context, a Service, and a PodDisruptionBudget.
#
# Before using it:
#   * Create a PersistentVolumeClaim named `vodnik-media` holding your files, or remove the volume
#     and the [assets.*] table and resolve assets through a mapper (docs/mapper-api.md).
#   * Pin the image by digest.
#   * Put an Ingress or CDN that provides TLS in front of the Service; vodnik has none.
#
#   kubectl apply -f deploy/kubernetes/vodnik.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vodnik-config
  labels:
    app.kubernetes.io/name: vodnik
data:
  vod.toml: |
    [server]
    listen = "0.0.0.0:3000"
    shutdown_delay_ms = 5000
    shutdown_grace_ms = 30000

    [storage]
    media_root = "/srv/vod"

    [packaging]
    segment_duration_ms = 6000

    [logging]
    level = "info"
    format = "json"

    [limits]
    max_index_bytes = 536870912

    [cors]
    enabled = true
    allowed_origins = ["*"]

    [assets.sample]
    path = "sample.mp4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodnik
  labels:
    app.kubernetes.io/name: vodnik
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vodnik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vodnik
    spec:
      # Longer than shutdown_delay_ms plus shutdown_grace_ms (35 s), so a rolling update drains
      # in-flight streams before the pod is killed.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vodnik
          image: ghcr.io/vodnik-rs/vodnik:latest   # pin by digest in production
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /health says the process is alive. /ready turns 503 once shutdown begins (and, with a
          # mapper, while the mapper is unreachable), which is what takes a pod out of the Service.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 30   # up to a minute to load a large catalog
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            # Above limits.max_index_bytes (512 MiB) plus headroom for segments being streamed.
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/vod
              readOnly: true
            - name: media
              mountPath: /srv/vod
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vodnik-config
        - name: media
          persistentVolumeClaim:
            claimName: vodnik-media
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: vodnik
  labels:
    app.kubernetes.io/name: vodnik
spec:
  selector:
    app.kubernetes.io/name: vodnik
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vodnik
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vodnik
